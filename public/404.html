<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Eurovia Tourism</title>
    <script>
      // GitHub Pages SPA redirect workaround
      // Preserves the path and redirects to index.html with it as a query param
      var segmentCount = 1; // number of path segments in the repo name (1 for /Eurovia-Tourism)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
